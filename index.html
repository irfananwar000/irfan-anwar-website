        <button type="button" data-bs-target="#fullscreenCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#fullscreenCarousel" data-bs-slide-to="2"></button>
        <button type="button" data-bs-target="#fullscreenCarousel" data-bs-slide-to="3"></button>
        <button type="button" data-bs-target="#fullscreenCarousel" data-bs-slide-to="4"></button>
        <button type="button" data-bs-target="#fullscreenCarousel" data-bs-slide-to="5"></button>

    <div class="carousel-inner h-100">

            <img src="images/holy-elephant.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Art 1">
        </div>
        <div class="carousel-item h-100">
            <img src="images/old-is-gold.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Art 2">
        </div>
        <div class="carousel-item h-100">
            <img src="images/crisis-of-civilization-01.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Art 3">
        </div>
        <div class="carousel-item h-100">
            <img src="images/crisis-of-civilization-06.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Art 4">
        </div>
        <div class="carousel-item h-100">
            <img src="images/black-white-02.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Art 5">
        </div>
        <div class="carousel-item h-100">
            <img src="images/untitled-01.jpg" class="d-block w-100 h-100 object-fit-cover" alt="Art 6">
        </div>
        
    </div>
</div>
